---
version: 2

updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: node
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    assignees:
      - nosborn

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - nosborn

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    cooldown:
      default-days: 7
    assignees:
      - nosborn
